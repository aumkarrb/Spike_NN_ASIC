<svg viewBox="0 0 1700 920" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif">

  <defs>
    <marker id="aGray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#9A9A9A"/>
    </marker>
    <marker id="aPurple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6B5FA8"/>
    </marker>
    <marker id="aGreen" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1D9C77"/>
    </marker>
    <marker id="aDash" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6B6656"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1700" height="920" fill="#FFFFFF"/>

  <!-- ============ top control block (runtime params) ============ -->
  <rect x="800" y="55" width="360" height="110" rx="22" fill="#F1EDE3" stroke="#A79F87" stroke-width="1.6"/>
  <text x="980" y="100" font-size="21" font-weight="700" fill="#4A4638" text-anchor="middle">Runtime parameter ports</text>
  <text x="980" y="128" font-size="15.5" fill="#6B6656" text-anchor="middle">threshold_in &#183; reset_val_in &#183; leak_shift_in</text>
  <text x="980" y="150" font-size="13.5" fill="#8A8570" text-anchor="middle">(live inputs, not localparams)</text>

  <path d="M900,165 L900,195 L1330,195 L1330,255" fill="none" stroke="#6B6656" stroke-width="1.8" stroke-dasharray="7 6" marker-end="url(#aDash)"/>

  <!-- ============ "one neuron per cycle" annotation ============ -->
  <text x="60" y="230" font-size="19" fill="#4A4638">one neuron serviced per cycle</text>
  <line x1="60" y1="240" x2="360" y2="240" stroke="#C9C3B0" stroke-width="1.3"/>

  <!-- ============ main pipeline row ============ -->
  <!-- Box 1: rr_sel counter -->
  <rect x="60" y="260" width="268" height="170" rx="22" fill="#F1EDE3" stroke="#A79F87" stroke-width="1.8"/>
  <text x="194" y="330" font-size="24" font-weight="700" fill="#4A4638" text-anchor="middle">rr_sel counter</text>
  <text x="194" y="362" font-size="16" fill="#6B6656" text-anchor="middle">0 .. Neurons&#8722;1</text>
  <text x="194" y="386" font-size="16" fill="#6B6656" text-anchor="middle">free-running, wraps</text>

  <path d="M328,345 L378,345" stroke="#9A9A9A" stroke-width="2.2" marker-end="url(#aGray)"/>

  <!-- Box 2: pending_current fetch -->
  <rect x="378" y="260" width="300" height="170" rx="22" fill="#FBE3D8" stroke="#C97452" stroke-width="1.8"/>
  <text x="528" y="330" font-size="24" font-weight="700" fill="#8A3D1F" text-anchor="middle">pending_current[] fetch</text>
  <text x="528" y="362" font-size="16" fill="#B85A34" text-anchor="middle">latched current for</text>
  <text x="528" y="386" font-size="16" fill="#B85A34" text-anchor="middle">neuron rr_sel, if any</text>

  <path d="M678,345 L728,345" stroke="#9A9A9A" stroke-width="2.2" marker-end="url(#aGray)"/>

  <!-- Box 3: Leak + inject -->
  <rect x="728" y="260" width="300" height="170" rx="22" fill="#FBE3D8" stroke="#C97452" stroke-width="1.8"/>
  <text x="878" y="322" font-size="24" font-weight="700" fill="#8A3D1F" text-anchor="middle">Leak + inject</text>
  <text x="878" y="354" font-size="15.5" fill="#B85A34" text-anchor="middle">v' = v &#8722; (v &#8811;&#8811;&#8811; leak_shift_in)</text>
  <text x="878" y="378" font-size="15.5" fill="#B85A34" text-anchor="middle">+ pending_current</text>

  <path d="M1028,345 L1078,345" stroke="#9A9A9A" stroke-width="2.2" marker-end="url(#aGray)"/>

  <!-- Box 4: Threshold compare -->
  <rect x="1078" y="260" width="268" height="170" rx="22" fill="#FBE3D8" stroke="#C97452" stroke-width="1.8"/>
  <text x="1212" y="330" font-size="24" font-weight="700" fill="#8A3D1F" text-anchor="middle">Threshold compare</text>
  <text x="1212" y="362" font-size="16" fill="#B85A34" text-anchor="middle">v' &#8805; threshold_in ?</text>
  <text x="1212" y="386" font-size="16" fill="#B85A34" text-anchor="middle">spike this cycle</text>

  <path d="M1346,345 L1396,345" stroke="#9A9A9A" stroke-width="2.2" marker-end="url(#aGray)"/>

  <!-- Box 5: Commit -->
  <rect x="1396" y="260" width="260" height="170" rx="22" fill="#E7E2F7" stroke="#7B6FC4" stroke-width="1.8"/>
  <text x="1526" y="316" font-size="24" font-weight="700" fill="#3B2E7A" text-anchor="middle">Commit</text>
  <text x="1526" y="346" font-size="15" fill="#5B4EA0" text-anchor="middle">spike ? reset_val_in : v'</text>
  <text x="1526" y="370" font-size="15" fill="#5B4EA0" text-anchor="middle">spike_bus[rr_sel] &#8592; 1</text>
  <text x="1526" y="394" font-size="15" fill="#5B4EA0" text-anchor="middle">for one cycle</text>

  <!-- ============ feedback: state write-back ============ -->
  <path d="M1526,430 L1526,560 L878,560 L878,430" fill="none" stroke="#6B5FA8" stroke-width="2.2" marker-end="url(#aPurple)"/>
  <text x="1200" y="548" font-size="18" fill="#6B6656" text-anchor="middle">neuron_v[] state write-back</text>

  <!-- ============ feedback branch: observability ============ -->
  <path d="M1526,560 L1526,650" fill="none" stroke="#1D9C77" stroke-width="2.2"/>
  <path d="M1526,650 L1650,650 L1650,720" fill="none" stroke="#1D9C77" stroke-width="2.2" marker-end="url(#aGreen)"/>

  <rect x="1450" y="740" width="200" height="120" rx="20" fill="#DCF1E8" stroke="#3F9E7C" stroke-width="1.8"/>
  <text x="1550" y="785" font-size="20" font-weight="700" fill="#0E4A38" text-anchor="middle">Observability</text>
  <text x="1550" y="812" font-size="14" fill="#1D7A5C" text-anchor="middle">spike_bus[15:0]</text>
  <text x="1550" y="834" font-size="14" fill="#1D7A5C" text-anchor="middle">voltage_flat</text>

  <!-- caption -->
  <text x="60" y="880" font-size="15" fill="#8A8A8A">pipelined_lif.v &#183; Neurons=16 &#183; Pipeline_Stages=4 &#183; a per-neuron pending register decouples current arrival from service timing</text>

</svg>
